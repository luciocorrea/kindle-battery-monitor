description "Kindle battery BTHome monitor"

# battery_ready follows display_ready and mounted_userstore on this firmware.
start on (battery_ready and dbus_ready and started powerd and started btfd)
stop on (stopping lab126 or stopping dbus or stopping powerd or stopping btfd)

# Enable is bounded at 30 seconds; cleanup and listener shutdown need additional time.
kill timeout 50

# No respawn: a failed radio cleanup needs inspection before another attempt.
exec /mnt/us/extensions/kindle-battery-monitor/bin/kindle-battery-monitor run
