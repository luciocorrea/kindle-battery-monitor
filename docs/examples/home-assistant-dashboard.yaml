# Full dashboard configuration for an empty, manually managed dashboard.
# Replace sensor.kindle_battery with your BTHome battery entity ID.
title: Kindle battery
views:
  - title: Battery
    path: battery
    icon: mdi:battery
    type: sections
    max_columns: 2
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Kindle battery
            heading_style: title
            icon: mdi:book-open-variant
          - type: gauge
            entity: sensor.kindle_battery
            name: Kindle battery
            min: 0
            max: 100
            severity:
              green: 30
              yellow: 15
              red: 0
            grid_options:
              columns: full
              rows: auto
          - type: markdown
            content: >-
              Updates on battery changes and every 10 minutes while the Kindle is awake.
              The last reported percentage remains here while it sleeps.
            grid_options:
              columns: full
              rows: auto
      - type: grid
        cards:
          - type: heading
            heading: Battery history
            heading_style: title
            icon: mdi:chart-line
          - type: history-graph
            entities:
              - entity: sensor.kindle_battery
                name: Kindle
            hours_to_show: 24
            grid_options:
              columns: full
              rows: auto
