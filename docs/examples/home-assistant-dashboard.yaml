# Full dashboard configuration for an empty, manually managed dashboard.
# Replace sensor.kindle_battery and binary_sensor.kindle_charging with your
# BTHome battery and charging entity IDs.
title: Kindle battery
views:
  - title: Battery
    path: battery
    icon: mdi:battery
    type: sections
    max_columns: 2
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Kindle battery
            heading_style: title
            icon: mdi:book-open-variant
          - type: gauge
            entity: sensor.kindle_battery
            name: Kindle battery
            min: 0
            max: 100
            severity:
              green: 30
              yellow: 15
              red: 0
            grid_options:
              columns: full
              rows: auto
          - type: tile
            entity: binary_sensor.kindle_charging
            name: Charging status
            state_content: state
            color: green
            tap_action:
              action: more-info
            icon_tap_action:
              action: more-info
            grid_options:
              columns: full
              rows: 1
          - type: markdown
            content: >-
              Updates on battery and charging changes, and every 10 minutes while the
              Kindle is awake. Both values show the last received report while it sleeps.
            grid_options:
              columns: full
              rows: auto
      - type: grid
        cards:
          - type: heading
            heading: Battery and charging history
            heading_style: title
            icon: mdi:chart-line
          - type: history-graph
            entities:
              - entity: sensor.kindle_battery
                name: Kindle
            hours_to_show: 24
            grid_options:
              columns: full
              rows: auto
          - type: history-graph
            title: Charging · last 24 hours
            entities:
              - entity: binary_sensor.kindle_charging
                name: Charging
            hours_to_show: 24
            grid_options:
              columns: full
              rows: auto
