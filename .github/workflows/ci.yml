name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    name: Verify and package
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      RUSTC_WRAPPER: ''
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install host prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes dbus-daemon coreutils
          rustup show active-toolchain
          rustup component add clippy rustfmt
      - name: Install qualified cross revision
        run: cargo install --locked --git https://github.com/cross-rs/cross --rev 65fe72b0cdb1e7e0cc0652517498d4389cc8f5cf cross
      - name: Read package version and validate release tag
        id: package
        shell: bash
        run: |
          version=$(cargo metadata --locked --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "kindle-battery-monitor") | .version')
          test -n "$version"
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "Release tag must be v$version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Verify host and ARM
        run: cargo xtask verify --arm
      - name: Build release package
        run: cargo xtask package
      - name: Verify archive checksum
        run: cd dist && sha256sum --check ./*.zip.sha256
      - name: Upload KUAL package
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: kindle-kual-${{ github.sha }}
          path: |
            dist/kindle-battery-monitor-${{ steps.package.outputs.version }}.zip
            dist/kindle-battery-monitor-${{ steps.package.outputs.version }}.zip.sha256
          if-no-files-found: error
          retention-days: 14
