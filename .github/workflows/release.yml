name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/ci.yml
  publish:
    name: Create draft release
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: kindle-kual-${{ github.sha }}
          path: dist
      - name: Verify downloaded checksum
        run: cd dist && sha256sum --check ./*.zip.sha256
      - name: Create draft with verified assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" --verify-tag --draft \
            --title "$RELEASE_TAG" \
            --notes 'KUAL package built and verified by GitHub Actions. See README for the qualified hardware and firmware. Host and ARM checks do not establish physical radio or suspend acceptance.' \
            dist/*.zip dist/*.zip.sha256
